name: Tests with Report

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'code/**'

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.hash.outputs.hash }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate Docker image tag
      id: hash
      run: |
        # Генерируем хэш на основе содержимого Dockerfile и кода тестов
        HASH=$(sha256sum tests_files/Dockerfile.base code/Tests/* 2>/dev/null | sha256sum | cut -c1-12)
        echo "hash=$HASH" >> $GITHUB_OUTPUT
        echo "Image tag will be: $HASH"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build base test image
      run: |
        docker build -t bd-tests-base:${{ steps.hash.outputs.hash }} \
                     -f ./tests_files/Dockerfile.base ./code

  unit-tests:
    runs-on: ubuntu-latest
    needs: build-test-image

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load or pull test image
      run: |
        # Если образ уже собран локально в этом workflow (проверяем кэш)
        if docker image inspect bd-tests-base:${{ needs.build-test-image.outputs.image-tag }} >/dev/null 2>&1; then
          echo "Image found locally"
        else
          # Или пуллим из registry если сохраняли
          # docker pull ghcr.io/${{ github.repository }}/bd-tests-base:${{ needs.build-test-image.outputs.image-tag }}
          # Или собираем заново
          echo "Building image..."
          docker build -t bd-tests-base:${{ needs.build-test-image.outputs.image-tag }} \
                       -f ./tests_files/Dockerfile.base ./code
        fi

    - name: Run unit tests with HTML output
      run: |
        mkdir -p test-results
        docker run --rm \
          -v $(pwd)/test-results:/test-results \
          bd-tests-base:${{ needs.build-test-image.outputs.image-tag }} \
          dotnet test Tests/Tests.csproj -c Release \
            --filter "Category=Unit" \
            --logger "html;LogFileName=/test-results/unit-report.html" \
            --no-build

    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: test-results/unit-report.html
        retention-days: 2

  integration-tests:
    runs-on: ubuntu-latest
    needs: [build-test-image, unit-tests]
    if: success()

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integrationdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load test image
      run: |
        docker build -t bd-tests-base:${{ needs.build-test-image.outputs.image-tag }} \
                     -f ./tests_files/Dockerfile.base ./code

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to start..."
        for i in {1..30}; do
          if nc -z localhost 5432; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting for PostgreSQL... Attempt $i/30"
          sleep 2
        done
        echo "PostgreSQL failed to start within 60 seconds"
        exit 1

    - name: Run integration tests
      run: |
        mkdir -p test-results
        docker run --rm \
          --network host \
          -v $(pwd)/test-results:/test-results \
          bd-tests-base:${{ needs.build-test-image.outputs.image-tag }} \
          dotnet test Tests/Tests.csproj -c Release \
            --filter "Category=Integration" \
            --logger "html;LogFileName=/test-results/integration-report.html" \
            --no-build

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-report
        path: test-results/integration-report.html
        retention-days: 2
        
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-test-image, integration-tests]
    if: success()

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: E2Edb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load test image
      run: |
        docker build -t bd-tests-base:${{ needs.build-test-image.outputs.image-tag }} \
                     -f ./tests_files/Dockerfile.base ./code

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to start..."
        for i in {1..30}; do
          if nc -z localhost 5432; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting for PostgreSQL... Attempt $i/30"
          sleep 2
        done
        echo "PostgreSQL failed to start within 60 seconds"
        exit 1

    - name: Run e2e tests
      env:
        TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        TESTER_TOKEN: ${{ secrets.TESTER_TOKEN }}
        TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
        TESTER_CHAT_ID: ${{ secrets.TESTER_CHAT_ID }}
        DB_CONNECTION_STRING: "Host=localhost;Port=5432;Database=E2Edb;Username=postgres;Password=postgres"
        DB_MESSAGE_SENDER_CONNECTION_STRING: "Host=localhost;Port=5432;Database=E2EMessageSenderdb;Username=postgres;Password=postgres"
        ASPNETCORE_ENVIRONMENT: Docker
        DOTNET_ENVIRONMENT: Docker
      run: |
        mkdir -p test-results
        docker run --rm \
          --network host \
          -v $(pwd)/test-results:/test-results \
          -e TEST_TOKEN="$TEST_TOKEN" \
          -e TESTER_TOKEN="$TESTER_TOKEN" \
          -e TEST_CHAT_ID="$TEST_CHAT_ID" \
          -e TESTER_CHAT_ID="$TESTER_CHAT_ID" \
          -e DB_CONNECTION_STRING="$DB_CONNECTION_STRING" \
          -e DB_MESSAGE_SENDER_CONNECTION_STRING="$DB_MESSAGE_SENDER_CONNECTION_STRING" \
          -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
          -e DOTNET_ENVIRONMENT="$DOTNET_ENVIRONMENT" \
          bd-tests-base:${{ needs.build-test-image.outputs.image-tag }} \
          sh -c "
            echo 'Waiting for PostgreSQL...' &&
            until pg_isready -h localhost -p 5432 -U postgres; do
              sleep 2
            done &&
            echo 'Running E2E tests...' &&
            dotnet test Tests/Tests.csproj -c Release \
              --filter 'Category=E2E' \
              --logger 'html;LogFileName=/test-results/e2e-report.html' \
              --verbosity detailed \
              --logger 'console;verbosity=detailed' \
              --no-build
          "

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: E2E-test-report
        path: test-results/e2e-report.html
        retention-days: 2