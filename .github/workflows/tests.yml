name: Tests with Report

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'code/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build test image
      run: docker build -t bd-unit-tests -f ./tests_files/Dockerfile.unit ./code
      
    - name: Run unit tests with HTML output
      run: |
        mkdir -p test-results
        docker run --rm -v $(pwd)/test-results:/test-results bd-unit-tests --logger "html;LogFileName=/test-results/unit-report.html"

    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: test-results/unit-report.html
        retention-days: 2

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success()

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integrationdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build integration test image
      run: docker build -t bd-integration-tests -f ./tests_files/Dockerfile.integration ./code

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to start..."
        for i in {1..30}; do
          if nc -z localhost 5432; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting for PostgreSQL... Attempt $i/30"
          sleep 2
        done
        echo "PostgreSQL failed to start within 60 seconds"
        exit 1

    - name: Run integration tests with HTML output
      run: |
        mkdir -p test-results
        docker run --rm \
          --network host \
          -v $(pwd)/test-results:/test-results \
          bd-integration-tests \
          --logger "html;LogFileName=/test-results/integration-report.html"

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-report
        path: test-results/integration-report.html
        retention-days: 2
        
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: success()

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: E2Edb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build e2e test image
      run: docker build -t bd-e2e-tests -f ./tests_files/Dockerfile.e2e ./code

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to start..."
        for i in {1..30}; do
          if nc -z localhost 5432; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting for PostgreSQL... Attempt $i/30"
          sleep 2
        done
        echo "PostgreSQL failed to start within 60 seconds"
        exit 1

    - name: Run e2e tests with HTML output
      env:
        TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        TESTER_TOKEN: ${{ secrets.TESTER_TOKEN }}
        TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
        TESTER_CHAT_ID: ${{ secrets.TESTER_CHAT_ID }}
        DB_CONNECTION_STRING: "Host=localhost;Port=5432;Database=E2Edb;Username=postgres;Password=postgres"
        DB_MESSAGE_SENDER_CONNECTION_STRING: "Host=localhost;Port=5432;Database=E2EMessageSenderdb;Username=postgres;Password=postgres"
        ASPNETCORE_ENVIRONMENT: Docker
        DOTNET_ENVIRONMENT: Docker
      run: |
        mkdir -p test-results
        docker run --rm \
          --network host \
          -v $(pwd)/test-results:/test-results \
          -e TEST_TOKEN="$TEST_TOKEN" \
          -e TESTER_TOKEN="$TESTER_TOKEN" \
          -e TEST_CHAT_ID="$TEST_CHAT_ID" \
          -e TESTER_CHAT_ID="$TESTER_CHAT_ID" \
          -e DB_CONNECTION_STRING="$DB_CONNECTION_STRING" \
          -e DB_MESSAGE_SENDER_CONNECTION_STRING="$DB_MESSAGE_SENDER_CONNECTION_STRING" \
          -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
          -e DOTNET_ENVIRONMENT="$DOTNET_ENVIRONMENT" \
          bd-e2e-tests \
          sh -c "
            echo 'Waiting for PostgreSQL...' &&
            until pg_isready -h localhost -p 5432 -U postgres; do
              sleep 2
            done &&
            echo 'Running tests...' &&
            dotnet test Tests/Tests.csproj -c Release \
              --filter 'Category=E2E' \
              --logger 'html;LogFileName=/test-results/e2e-report.html' \
              --verbosity detailed \
              --logger 'console;verbosity=detailed'
          "

    - name: Upload E2E test results
      if : always()
      uses: actions/upload-artifact@v4
      with:
        name: E2E-test-report
        path: test-results/e2e-report.html
        retention-days: 2
  bdd-tests:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: success()

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: E2Edb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build bdd test image
      run: docker build -t bd-bdd-tests -f ./tests_files/Dockerfile.bdd ./code

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to start..."
        for i in {1..30}; do
          if nc -z localhost 5432; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Waiting for PostgreSQL... Attempt $i/30"
          sleep 2
        done
        echo "PostgreSQL failed to start within 60 seconds"
        exit 1

    - name: Run bdd tests with HTML output
      env:
        TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
        TESTER_TOKEN: ${{ secrets.TESTER_TOKEN }}
        TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
        TESTER_CHAT_ID: ${{ secrets.TESTER_CHAT_ID }}
        DB_CONNECTION_STRING: "Host=localhost;Port=5432;Database=E2Edb;Username=postgres;Password=postgres"
        DB_MESSAGE_SENDER_CONNECTION_STRING: "Host=localhost;Port=5432;Database=E2EMessageSenderdb;Username=postgres;Password=postgres"
        ASPNETCORE_ENVIRONMENT: Docker
        DOTNET_ENVIRONMENT: Docker
      run: |
        mkdir -p test-results
        docker run --rm \
          --network host \
          -v $(pwd)/test-results:/test-results \
          -e TEST_TOKEN="$TEST_TOKEN" \
          -e TESTER_TOKEN="$TESTER_TOKEN" \
          -e TEST_CHAT_ID="$TEST_CHAT_ID" \
          -e TESTER_CHAT_ID="$TESTER_CHAT_ID" \
          -e DB_CONNECTION_STRING="$DB_CONNECTION_STRING" \
          -e DB_MESSAGE_SENDER_CONNECTION_STRING="$DB_MESSAGE_SENDER_CONNECTION_STRING" \
          -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
          -e DOTNET_ENVIRONMENT="$DOTNET_ENVIRONMENT" \
          bd-bdd-tests \
          sh -c "
            echo 'Waiting for PostgreSQL...' &&
            until pg_isready -h localhost -p 5432 -U postgres; do
              sleep 2
            done &&
            echo 'Running tests...' &&
            dotnet test Tests/Tests.csproj -c Release \
              --filter 'Category=BDD' \
              --logger 'html;LogFileName=/test-results/bdd-report.html' \
              --verbosity detailed \
              --logger 'console;verbosity=detailed'
          "

    - name: Upload BDD test results
      if : always()
      uses: actions/upload-artifact@v4
      with:
        name: BDD-test-report
        path: test-results/bdd-report.html
        retention-days: 2