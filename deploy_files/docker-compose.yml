      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256M
    mem_reservation: 128M
    cpus: 0.5
    networks:
      - postgres-cluster-2

  message_sender-1:
    build:
      context: ../code
      dockerfile: ../deploy_files/Dockerfile.messagesender
    environment:
      - BASE_URL=http://nginx-internal-1:5000
      - DB_CONNECTION_STRING=Host=postgres-1-replica-1;Port=5432;Database=messagesenderdb;Username=postgres;Password=postgres
      - SECRET_KEY=$SECRET_KEY
      - BOT_TOKEN=$BOT_TOKEN1
    depends_on:
      nginx-internal-1:
        condition: service_healthy
    volumes:
      - ./logs/message_sender-1:/app/logs
    mem_limit: 256M
    mem_reservation: 128M
    cpus: 0.5
    networks:
      - postgres-cluster-1

  nginx-external:
    image: nginx:alpine
    ports:
      - "8888:80"
    environment:
      - SERVICE1_HOST=nginx-internal-1
      - SERVICE1_PORT=5000
      - SERVICE2_HOST=nginx-internal-2
      - SERVICE2_PORT=5000
      - PGADMIN_HOST=pgadmin
      - PGADMIN_PORT=80
      - HOST=80
    volumes:
      - ./nginx/static:/usr/share/nginx/static:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./logs/nginx-external:/app/logs
      - ./nginx/nginx_external.conf.template:/etc/nginx/conf.d/nginx.conf.template
    command: >
      /bin/sh -c "
      echo 'Starting envsubst...' &&
      envsubst '$$SERVICE1_HOST $$SERVICE1_PORT $$SERVICE2_HOST $$SERVICE2_PORT $$PGADMIN_HOST $$PGADMIN_PORT $$HOST' 
      < /etc/nginx/conf.d/nginx.conf.template > /etc/nginx/nginx.conf &&
      echo 'Configuration generated. Testing nginx config...' &&
      nginx -t &&
      echo 'Starting nginx...' &&
      nginx -g 'daemon off;'"
    depends_on:
      nginx-internal-1:
        condition: service_healthy
      nginx-internal-2:
        condition: service_healthy
    mem_limit: 256M
    mem_reservation: 128M
    cpus: 0.5
    networks:
      - postgres-cluster-1
      - postgres-cluster-2
      - default

volumes:
  postgres_1_master_data:
  postgres_1_replica1_data:
  postgres_1_replica2_data:
  postgres_2_master_data:
  postgres_2_replica1_data:
  postgres_2_replica2_data:

networks:
  postgres-cluster-1:
    driver: bridge
  postgres-cluster-2:
    driver: bridge
  default:
    driver: bridge