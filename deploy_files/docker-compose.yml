services:
  # ==================== POSTGRES CLUSTER 1 ====================
  postgres-1-master:
    image: postgres:15
    container_name: postgres-1-master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasktracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_1_master_data:/var/lib/postgresql/data
      - ./postgres/master-init:/docker-entrypoint-initdb.d
    networks:
      - postgres-cluster-1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasktracker"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-1-replica-1:
    image: postgres:15
    container_name: postgres-1-replica-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_1_replica1_data:/var/lib/postgresql/data
    networks:
      - postgres-cluster-1
    depends_on:
      postgres-1-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      bash -c "
        # Ждем пока мастер полностью запустится и создаст слоты
        until PGPASSWORD=postgres psql -h postgres-1-master -U postgres -d tasktracker -c 'SELECT 1' > /dev/null 2>&1; do
          echo 'Waiting for master to be ready...'
          sleep 5
        done
        
        echo 'Master is ready. Checking replication slots...'
        sleep 10
        
        # Проверяем существование данных
        if [ -f /var/lib/postgresql/data/postgresql.conf ]; then
          echo 'Data directory already exists, skipping initialization'
        else
          echo 'Cleaning data directory...'
          rm -rf /var/lib/postgresql/data/*
          
          echo 'Creating base backup...'
          PGPASSWORD=postgres pg_basebackup -h postgres-1-master -U postgres -D /var/lib/postgresql/data -P -R -X stream -C -S replica_slot_1
          
          echo 'Base backup completed'
        fi
        
        echo 'Starting replica...'
        exec docker-entrypoint.sh postgres
      "

  postgres-1-replica-2:
