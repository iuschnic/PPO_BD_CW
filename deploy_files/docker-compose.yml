          echo 'Base backup completed'
        fi
        
        echo 'Starting replica...'
        exec docker-entrypoint.sh postgres
      "

  # ==================== SERVICE CONFIGURATION ====================

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tasktracker.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    networks:
      - postgres-cluster-1
      - postgres-cluster-2
      - default

  # Service-1 applications
  webcli-main-1:
    build:
      context: ../code
      dockerfile: ../deploy_files/Dockerfile.webcli
    ports:
      - "5234:5234"
    environment:
      - DB_CONNECTION_STRING=Host=postgres-1-master;Port=5432;Database=tasktracker;Username=postgres;Password=postgres
      - ENABLE_BENCHMARK=false
      - ASPNETCORE_URLS=http://+:5234
      - LANG=ru_RU.UTF-8
      - LC_ALL=ru_RU.UTF-8
    depends_on:
      postgres-1-master:
        condition: service_healthy
    volumes:
      - ./logs/webcli-main-1:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5234/swagger/index.html"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - postgres-cluster-1
    mem_limit: 256M
    mem_reservation: 128M
    cpus: 1

  webcli-reader-1-1:
    build:
      context: ../code
      dockerfile: ../deploy_files/Dockerfile.webcli
    ports:
      - "5235:5234"
    environment:
      - DB_CONNECTION_STRING=Host=postgres-1-replica-1;Port=5432;Database=tasktracker;Username=postgres;Password=postgres
      - ENABLE_BENCHMARK=false
