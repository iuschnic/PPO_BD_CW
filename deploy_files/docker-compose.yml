  # NGINX Servers
  nginx-internal-1:
    image: nginx:alpine
    ports:
      - "5000:5000"
    environment:
      - SECRET=$SECRET_KEY
      - MAIN_HOST=webcli-main-1
      - MAIN_PORT=5234
      - READER1_HOST=webcli-reader-1-1
      - READER1_PORT=5234
      - READER2_HOST=webcli-reader-1-2
      - READER2_PORT=5234
      - HOST=5000
    depends_on:
      webcli-main-1:
        condition: service_healthy
      webcli-reader-1-1:
        condition: service_healthy
      webcli-reader-1-2:
        condition: service_healthy
    volumes:
      - ./logs/nginx-internal-1:/var/log/nginx
      - ./nginx/nginx_internal.conf.template:/etc/nginx/conf.d/nginx.conf.template
    command: >
      /bin/sh -c "
      echo 'Starting envsubst...' &&
      envsubst '$$SECRET $$MAIN_HOST $$MAIN_PORT $$READER1_HOST $$READER1_PORT $$READER2_HOST $$READER2_PORT $$HOST' 
      < /etc/nginx/conf.d/nginx.conf.template > /etc/nginx/nginx.conf &&
      echo 'Configuration generated. Testing nginx config...' &&
      nginx -t &&
      echo 'Starting nginx...' &&
      nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256M
    mem_reservation: 128M
    cpus: 0.5
    networks:
      - postgres-cluster-1

