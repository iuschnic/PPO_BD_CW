  message_sender-1:
    build:
      context: ../code
      dockerfile: ../deploy_files/Dockerfile.messagesender
    environment:
      - BASE_URL=http://nginx-internal-1:5000
      - DB_CONNECTION_STRING=Host=postgres-1;Port=5432;Database=messagesenderdb;Username=postgres;Password=postgres
      - SECRET_KEY=$SECRET_KEY
      - BOT_TOKEN=$BOT_TOKEN1
    depends_on:
