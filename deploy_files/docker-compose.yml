        condition: service_healthy
    volumes:
      - ./logs/message_sender-1:/app/logs
    mem_limit: 256M
    mem_reservation: 128M
    cpus: 0.5
      
  nginx-external:
    image: nginx:alpine
    ports:
      - "8888:80"
    environment:
      - SERVICE1_HOST=nginx-internal-1
      - SERVICE1_PORT=5000
      - SERVICE2_HOST=nginx-internal-2
      - SERVICE2_PORT=5000
      - PGADMIN_HOST=pgadmin
      - PGADMIN_PORT=80
      - HOST=80
    volumes:
      #- ./nginx/nginx_external.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/usr/share/nginx/static:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./logs/nginx-external:/app/logs
      - ./nginx/nginx_external.conf.template:/etc/nginx/conf.d/nginx.conf.template
    command: >
      /bin/sh -c "
      echo 'Starting envsubst...' &&
      envsubst '$$SERVICE1_HOST $$SERVICE1_PORT $$SERVICE2_HOST $$SERVICE2_PORT $$PGADMIN_HOST $$PGADMIN_PORT $$HOST' 
      < /etc/nginx/conf.d/nginx.conf.template > /etc/nginx/nginx.conf &&
      echo 'Configuration generated. Testing nginx config...' &&
      nginx -t &&
      echo 'Starting nginx...' &&
      nginx -g 'daemon off;'"
    depends_on:
      nginx-internal-1:
        condition: service_healthy
      nginx-internal-2:
        condition: service_healthy
    mem_limit: 256M
    mem_reservation: 128M
    cpus: 0.5